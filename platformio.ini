; PlatformIO Project Configuration File
;
; Projet : Monnayeur / Distributeur intelligent connecté
; 2 groupes : BISRIO et OXEWEUL
;

; =====================================================
; CONFIGURATION COMMUNE (partagée par tous les groupes)
; =====================================================
[env]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
board_build.partitions = min_spiffs.csv
lib_deps =
    knolleary/PubSubClient
    bblanchon/ArduinoJson

; =====================================================
; GROUPE 1 : BISRIO
; OTA : Buhaha2525/OTA_bin
; WiFi : Test / 12345678
; =====================================================
[env:bisrio]
build_flags =
    -DGROUP_BISRIO=1
    -DGROUP_NAME=\"BISRIO\"

; =====================================================
; GROUPE 2 : OXEWEUL
; OTA : (autre repo GitHub)
; WiFi : (autre WiFi)
; =====================================================
[env:oxeweul]
build_flags =
    -DGROUP_OXEWEUL=1
    -DGROUP_NAME=\"OXEWEUL\"